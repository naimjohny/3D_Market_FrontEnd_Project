[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Языковые редиректы с корня: по Accept-Language ведём на локализованную версию.
# Порядок важен: условные редиректы — до безусловного /→/en и до SPA-фолбэка.
[[redirects]]
  from = "/"
  to = "/ru"
  status = 302
  force = true
  conditions = {Language = ["ru"]}

[[redirects]]
  from = "/"
  to = "/en"
  status = 302
  force = true
  conditions = {Language = ["en"]}

[[redirects]]
  from = "/"
  to = "/es"
  status = 302
  force = true
  conditions = {Language = ["es"]}

[[redirects]]
  from = "/"
  to = "/de"
  status = 302
  force = true
  conditions = {Language = ["de"]}

[[redirects]]
  from = "/"
  to = "/pl"
  status = 302
  force = true
  conditions = {Language = ["pl"]}

[[redirects]]
  from = "/"
  to = "/tg"
  status = 302
  force = true
  conditions = {Language = ["tg"]}

[[redirects]]
  from = "/"
  to = "/kk"
  status = 302
  force = true
  conditions = {Language = ["kk"]}

[[redirects]]
  from = "/"
  to = "/fa"
  status = 302
  force = true
  conditions = {Language = ["fa"]}

[[redirects]]
  from = "/"
  to = "/ar"
  status = 302
  force = true
  conditions = {Language = ["ar"]}

[[redirects]]
  from = "/"
  to = "/ko"
  status = 302
  force = true
  conditions = {Language = ["ko"]}

[[redirects]]
  from = "/"
  to = "/zh"
  status = 302
  force = true
  conditions = {Language = ["zh"]}

# Фолбэк для корня без подходящего языка — английская версия.
[[redirects]]
  from = "/"
  to = "/en"
  status = 302
  force = true

# SPA-fallback: все роуты отдают index.html, роутингом занимается React Router.
# Пререндеренные dist/<locale>/**/index.html существуют как файлы и отдаются напрямую
# (200-рерайт не перекрывает существующие файлы). Держать последним.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ассеты Vite содержат хеш в имени файла — кэшируем навечно.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
